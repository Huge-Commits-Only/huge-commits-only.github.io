name: Security Verification
run-name: >-
  ${{
      github.event_name == 'pull_request'
      && format('Security Verification for CI: PR #{0} -> {1}', github.event.number, github.event.pull_request.title)
      ||
      github.event_name == 'push'
      && format('Security Verification for CI: Merge -> {0}', github.event.head_commit.message)
  }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-ci-test:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Git -- Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Trivy -- Test Secret, Misconfig -> File System
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          scanners: secret,misconfig
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
